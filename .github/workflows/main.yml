# ======================================================================
# SOVEREIGN STRESS MONITOR (SSM) — AUTOMATED DATA INGESTION WORKFLOW
# ======================================================================
# Version: 2.6 (hardened for Actions)
# ======================================================================

name: SSM Automated Macro Mining

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Ingesting Repository Architecture
      uses: actions/checkout@v4

    - name: Initializing Pure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executing Sovereign Master Ingestion
      id: ssm
      run: |
        set -o pipefail
        python ssm_core.py
      continue-on-error: true

    - name: Show SSM exit status
      run: |
        echo "SSM step conclusion: ${{ steps.ssm.outcome }}"
        ls -la ssm_historical_database.csv 2>/dev/null || echo "CSV not created yet"

    - name: Archiving and Preserving Historical Database
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ssm_live_database_package
        path: |
          **/ssm_historical_database.csv
        if-no-files-found: warn
        retention-days: 90
