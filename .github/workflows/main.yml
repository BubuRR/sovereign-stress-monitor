name: SSM CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python ssm_core.py
      - uses: actions/upload-artifact@v4
        with:
          name: ssm-artifacts
          path: |
            ssm_intelligence.db
            ssm_unified_report.json
          if-no-files-found: warn
