name: SSM Automated Macro Mining

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-triage:
    runs-on: ubuntu-latest

    steps:
    - name: Ingesting Repository Architecture
      uses: actions/checkout@v4

    - name: Initializing Pure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executing Sovereign Master Ingestion
      run: |
        # Запуск вашего асинхронного монолита v25.2
        python ssm_core.py

    - name: Archiving and Preserving Historical Database
      uses: actions/upload-artifact@v4
      with:
        name: ssm_live_database_package
        path: ssm_historical_database.csv
        retention-days: 90
