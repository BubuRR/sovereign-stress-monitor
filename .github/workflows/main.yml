name: SSM Automated Macro Mining

on:
  schedule:
    # Запуск каждые 6 часов (в 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Позволяет вам при желании запустить сбор данных вручную кнопкой в интерфейсе GitHub

jobs:
  run-triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Разрешение роботу GitHub вносить изменения в ваш репозиторий

    steps:
    - name: Ingesting Repository Architecture
      uses: actions/checkout@v4

    - name: Initializing Pure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executing Sovereign Master Ingestion
      run: |
        # Запуск вашего асинхронного монолита v25.2
        python ssm_core.py

    - name: Commit and Push Preserved Macro State
      run: |
        git config --global user.name "Odin-Bot"
        git config --global user.email "bot@sovereign.monitor"
        
        # Проверяем, появились ли новые записи в CSV-базе данных перед отправкой
        if [ -f ssm_historical_database.csv ]; then
          git add ssm_historical_database.csv
          
          # Защита от пустых коммитов, если данные не изменились секунда в секунду
          git diff-index --quiet HEAD || git commit -m "Automated state preservation node update: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push
        else
          echo "Database file not found, skipping commit."
        fi
