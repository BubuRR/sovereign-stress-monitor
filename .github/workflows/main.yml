name: SSM Automated Macro Mining

on:
  schedule:
    # Беспилотный круглосуточный запуск каждые 6 часов (4 раза в сутки по UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Открывает кнопку ручного принудительного запуска в интерфейсе GitHub

jobs:
  run-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Ingesting Repository Architecture
      uses: actions/checkout@v4

    - name: Initializing Pure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executing Sovereign Master Ingestion
      run: |
        # Запуск глобальной кросс-рыночной матрицы рисков v27.0
        python ssm_core.py

    - name: Archiving and Preserving Multi-Sleeve Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ssm_live_database_package
        # ДВУХКАНАЛЬНЫЙ СБОР: Робот принудительно забирает и CSV базу, и JSON паспорт угров
        path: |
          **/ssm_historical_database.csv
          **/ssm_unified_report.json
        if-no-files-found: error
        retention-days: 90
