name: SSM Automated Macro Mining

on:
  schedule:
    # Беспилотный автоматический запуск каждые 6 часов (4 раза в сутки по UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Открывает кнопку ручного принудительного запуска в интерфейсе GitHub

jobs:
  run-triage:
    runs-on: ubuntu-latest

    steps:
    - name: Ingesting Repository Architecture
      uses: actions/checkout@v4

    - name: Initializing Pure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executing Sovereign Master Ingestion
      run: |
        # Сервер запускает ваш глобальный многостраничный монолит
        python ssm_core.py

    - name: Archiving and Preserving Historical Database
      uses: actions/upload-artifact@v4
      with:
        name: ssm_live_database_package
        # Маска **/ принудительно заставляет робота обыскать все папки и забрать файл базы
        path: |
          **/ssm_historical_database.csv
        retention-days: 90
