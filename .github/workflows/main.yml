# ======================================================================
# SOVEREIGN STRESS MONITOR (SSM) — AUTOMATED DATA INGESTION WORKFLOW
# ======================================================================
# Version:   2.8 (Relational SQL Master Release)
# ======================================================================

name: SSM Automated Macro Mining

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Ingesting Repository Architecture
      uses: actions/checkout@v4

    - name: Initializing Pure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Hardened Production Dependencies
      run: |
        pip install numpy scipy ruptures

    - name: Executing Sovereign Master Ingestion
      run: |
        python ssm_core.py

    - name: Archiving and Preserving Relational Database
      uses: actions/upload-artifact@v4
      with:
        name: ssm_live_database_package
        # СБОР СУБД: Робот упаковывает бинарную базу данных SQLite и JSON паспорт угроз
        path: |
          **/ssm_intelligence.db
          **/ssm_unified_report.json
        if-no-files-found: error
        retention-days: 90
