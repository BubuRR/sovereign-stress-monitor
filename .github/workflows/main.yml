name: SSM CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  test-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Ingestion cycle
        run: python ssm_core.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssm-artifacts
          path: |
            ssm_intelligence.db
            ssm_unified_report.json
          if-no-files-found: warn
          retention-days: 30
