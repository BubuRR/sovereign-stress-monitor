# Auto-release when you push a version tag: v30.5.2, v31.0.0, ...
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & test
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Run one monitoring cycle
        run: python ssm_core.py
        continue-on-error: true

      - name: Build source archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=zip --prefix="sovereign-stress-monitor-${TAG}/" -o "dist/ssm-${TAG}-source.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SSM ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ssm-*.zip
            ssm_unified_report.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
