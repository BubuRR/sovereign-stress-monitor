version: "3.8"

services:
  ssm_backend:
    build: .
    container_name: ssm_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  ssm_dashboard:
    build: .
    container_name: ssm_dashboard
    command: streamlit run interface/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - ssm_backend
    restart: unless-stopped
